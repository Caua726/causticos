name: build

# causticos tracks the Caustic compiler's main branch, not its last release: the
# userspace passes `-Lbuild`, which v0.1.5 does not know. So CI bootstraps —
# the published release builds the current compiler, assembler, linker and build
# system from source, and everything after that uses those.
#
# The bootstrapped tools go into a prefix rather than beside the release,
# because the compiler resolves the standard library at
# `<dir of caustic>/../lib/caustic` and has to find the current one, not the
# release's. That layout is the whole reason for the copy step.
#
# This builds; it does not boot. Booting needs Limine for the ISO and QEMU to
# run it. `caustic-mk run verify` is the local gate: 6 boots at -smp 1/2/4.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the released toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo Caua726/Caustic \
            --pattern 'caustic-x86_64-linux.tar.gz' --output caustic.tar.gz
          tar xzf caustic.tar.gz
          echo "$PWD/caustic-x86_64-linux/bin" >> "$GITHUB_PATH"

      - name: Bootstrap the current toolchain
        run: |
          set -eu
          SRC="$RUNNER_TEMP/caustic-src"
          PREFIX="$RUNNER_TEMP/caustic"
          git clone --depth 1 --recurse-submodules \
            https://github.com/Caua726/Caustic "$SRC"
          cd "$SRC"
          for tool in caustic caustic-as caustic-ld caustic-mk; do
            caustic-mk build "$tool"
          done
          mkdir -p "$PREFIX/bin" "$PREFIX/lib/caustic"
          cp caustic caustic-as caustic-ld caustic-mk "$PREFIX/bin/"
          cp -r std "$PREFIX/lib/caustic/std"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"

      - name: Kernel
        run: caustic-mk build kernel

      - name: Userspace
        run: cd userspace && caustic-mk build all
