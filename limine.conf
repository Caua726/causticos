timeout: 0
quiet: yes

/causticos
    protocol: limine
    kernel_path: boot():/boot/kernel.elf
    # The mode Limine asks the firmware for. The kernel takes whatever it is
    # actually given (fb.cst reads width/height/pitch/bpp back from Limine), so
    # this is a preference, not an assumption — a machine without the mode
    # falls back and everything still lays out from the real numbers.
    resolution: 1280x720x32
